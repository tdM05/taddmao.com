<!DOCTYPE html><html><head><meta charset=UTF-8><title>palettes</title>
<style>
body{background:#0c0d10;color:#dfe4ea;font-family:system-ui,sans-serif;padding:36px}
h2{font-weight:500;font-size:15px;color:#9aa5ad;margin:28px 0 10px;letter-spacing:.04em}
.scheme{border:1px solid #262d34;border-radius:12px;padding:20px;margin-bottom:8px;background:#121519}
.name{font-family:monospace;font-size:12px;color:#8fb3c2;margin-bottom:14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:monospace;font-size:10px;color:#64717a}
.dot{width:44px;height:44px;border-radius:10px}
.bar{height:10px;width:220px;border-radius:6px;margin-top:14px}
.mini{margin-top:16px;font-size:13px}
.mini b{font-weight:600}
.tag{display:inline-block;font-family:monospace;font-size:10px;padding:2px 8px;border-radius:99px;margin-right:6px}
</style></head><body>
<h1 style="font-weight:600">Timeline palette options</h1>
<p style="color:#9aa5ad;font-size:13px">Each shows: accent · 3 thread colours (hobbies/research/life) · a sample tag + bar.</p>
<div id=out></div>
<script>
const schemes=[
 {name:"A · muted slate (near-neutral, very calm)", accent:"#93a7b0", threads:{hobbies:"#8ea6b2",research:"#93ad9c",life:"#c3ad93"}, bar:"#b9c2c8"},
 {name:"B · warm earth (sand/clay/sage, editorial)", accent:"#c2a888", threads:{hobbies:"#b7a184",research:"#93a58c",life:"#b98d76"}, bar:"#cbb79b"},
 {name:"C · dusty ink (desaturated blue-grey family)", accent:"#8c9db0", threads:{hobbies:"#8fa0b3",research:"#9bafa6",life:"#b3a394"}, bar:"#9aa7b5"},
 {name:"D · mono + one accent (grey threads, single warm accent)", accent:"#c4a878", threads:{hobbies:"#9aa5ad",research:"#9aa5ad",life:"#9aa5ad"}, bar:"#c4a878"},
 {name:"E · deep jewel-muted (plum/teal/ochre, richer but low sat)", accent:"#9d8ba0", threads:{hobbies:"#7f93a1",research:"#7d9b8f",life:"#b39a76"}, bar:"#a9a0ad"},
];
document.getElementById('out').innerHTML=schemes.map(s=>{
 const t=s.threads;
 return `<h2>${s.name}</h2><div class=scheme><div class=name>accent ${s.accent}</div>
 <div class=swatches>
  <div class=sw><div class=dot style="background:${s.accent}"></div>accent</div>
  <div class=sw><div class=dot style="background:${t.hobbies}"></div>hobbies</div>
  <div class=sw><div class=dot style="background:${t.research}"></div>research</div>
  <div class=sw><div class=dot style="background:${t.life}"></div>life</div>
  <div class=sw><div class=dot style="background:${s.bar}"></div>bar</div>
 </div>
 <div class=bar style="background:linear-gradient(90deg,${t.hobbies},${t.research},${t.life})"></div>
 <div class=mini>
   <span class=tag style="color:${t.hobbies};border:1px solid ${t.hobbies}">Hobbies</span>
   <span class=tag style="color:${t.research};border:1px solid ${t.research}">Research</span>
   <span class=tag style="color:${t.life};border:1px solid ${t.life}">Life</span>
 </div></div>`;
}).join('');
</script></body></html>

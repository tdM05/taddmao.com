<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Concept C · Gallery</title><link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Spectral:wght@400;500;600&display=swap" rel=stylesheet><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#eceae5;color:#1c1a17;font-family:'Inter',sans-serif;line-height:1.6}

.tile h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.big{grid-column:span 2;grid-row:span 2}.wide{grid-column:span 2}
.t-research{background:linear-gradient(135deg,#7a1e28,#3a1216)}
.t-art{background:linear-gradient(135deg,#4a5240,#2a2e22)}
.t-music{background:linear-gradient(135deg,#2f4858,#1a2730)}
.t-apps{background:linear-gradient(135deg,#5a4a2a,#2e2617)}
.t-cv{background:#1c1a17}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.big{grid-column:span 2}}
</style></head><body>

<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Anim 20 · name + geometry</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel=stylesheet>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;background:#0a0b0e;overflow:hidden}
#c{position:fixed;inset:0;display:block}
.eyebrow{position:fixed;top:6vh;left:7vw;z-index:2;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:300;letter-spacing:.24em;color:#5a6b74;text-transform:uppercase}
.subtitle{position:fixed;left:0;right:0;top:calc(50% + clamp(48px,7.5vw,96px));z-index:2;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:300;font-size:clamp(12px,1.5vw,15px);letter-spacing:.3em;color:#6f8b96;text-transform:uppercase;opacity:0;transition:opacity 1.8s ease 1s}
.subtitle.in{opacity:1}
</style></head><body>
<canvas id=c></canvas>
<div class=eyebrow>Math &amp; CS · University of Toronto</div>
<div class=subtitle id=sub>AI&nbsp;Verification&nbsp;Research</div>
<script>
(function(){
const cv=document.getElementById('c'),x=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,DPR,P=[],F=[];   // P = name particles, F = free drifting geometry points
const mouse={x:-9999,y:-9999,in:false};
function sample(){
  const o=document.createElement('canvas'),oc=o.getContext('2d');
  o.width=Math.round(W*DPR);o.height=Math.round(H*DPR);oc.scale(DPR,DPR);
  oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';
  let fs=Math.min(W*0.125,140);
  oc.font='500 '+fs+"px 'Inter',system-ui,sans-serif";
  while(oc.measureText('Tadd Mao').width>W*0.8&&fs>10){fs-=2;oc.font='500 '+fs+"px 'Inter',sans-serif";}
  oc.fillText('Tadd Mao',W/2,H*0.5);
  const img=oc.getImageData(0,0,o.width,o.height).data;
  const gap=Math.max(2,Math.round(2.6*DPR));
  const jit=gap*0.7;
  const dens=(px,py)=>{const n=Math.sin(px*0.010)*Math.cos(py*0.013)+Math.sin((px+py)*0.007+1.3)+Math.cos(px*0.021-py*0.009);return 0.28+0.6*((n/3)*0.5+0.5);};
  P=[];
  for(let y=0;y<o.height;y+=gap)for(let px=0;px<o.width;px+=gap){
    const cov=img[(y*o.width+px)*4+3]/255;
    if(cov>0.4 && Math.random()<dens(px/DPR,y/DPR)){
      const hx=(px+(Math.random()-.5)*jit)/DPR, hy=(y+(Math.random()-.5)*jit)/DPR;
      P.push({hx,hy,x:hx,y:hy,vx:0,vy:0,ph:Math.random()*6.28,sz:0.9,born:Math.random()*0.5,ex:0});
    }
  }
  // free drifting geometry points around the scene
  F=[];const nF=Math.max(10,Math.round(W/120));
  for(let i=0;i<nF;i++)F.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28});
}
function build(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth=innerWidth;H=cv.clientHeight=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);try{sample();}catch(e){console.error(e);}}
build();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>build()).catch(()=>{});
addEventListener('resize',build);
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;});
addEventListener('pointerleave',()=>mouse.in=false);

// transient construction events: chords among name particles, and links name<->free geometry, arcs, triangles
let events=[]; let lastEv=0;
function spawnEvent(t){
  const kind=Math.random();
  if(kind<0.5 && P.length>2){ // chord: connect two name particles
    const a=P[(Math.random()*P.length)|0], b=P[(Math.random()*P.length)|0];
    events.push({type:'seg',a,b,t0:t,life:120});
  } else if(kind<0.8 && P.length && F.length){ // reach from a name particle to a free point
    const a=P[(Math.random()*P.length)|0], b=F[(Math.random()*F.length)|0];
    events.push({type:'seg',a,b,t0:t,life:150});
    // sometimes a compass arc around the free point
    if(Math.random()<0.6) events.push({type:'arc',c:b,r:30+Math.random()*80,t0:t,life:150});
  } else if(F.length>2){ // triangle among free geometry -> blooms + ∎
    const a=F[(Math.random()*F.length)|0],b=F[(Math.random()*F.length)|0],c=F[(Math.random()*F.length)|0];
    events.push({type:'tri',a,b,c,t0:t,life:170});
  }
}
function P_at(o){return {x:o.x,y:o.y};}
let t=0,intro=0;
function frame(){
  t++; intro=Math.min(1,intro+0.01);
  x.clearRect(0,0,W,H);
  const ie=intro*intro*(3-2*intro);
  // move free geometry
  for(const f of F){f.x+=f.vx;f.y+=f.vy;if(f.x<0||f.x>W)f.vx*=-1;if(f.y<0||f.y>H)f.vy*=-1;}
  // occasional new construction event
  if(t-lastEv> (36+Math.random()*60)){lastEv=t;spawnEvent(t);}
  // draw faint background links among nearby free points (living lattice)
  x.lineWidth=1;
  for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){const d=Math.hypot(F[i].x-F[j].x,F[i].y-F[j].y);
    if(d<170){x.strokeStyle='rgba(150,180,200,'+(1-d/170)*0.10+')';x.beginPath();x.moveTo(F[i].x,F[i].y);x.lineTo(F[j].x,F[j].y);x.stroke();}}
  // free points
  for(const f of F){x.fillStyle='rgba(170,195,215,0.5)';x.beginPath();x.arc(f.x,f.y,1.4,0,6.28);x.fill();}
  // transient construction events
  for(let i=events.length-1;i>=0;i--){const e=events[i];const age=(t-e.t0)/e.life;if(age>1){events.splice(i,1);continue;}
    const fade=Math.sin(age*Math.PI); // ease in-out
    if(e.type==='seg'){x.strokeStyle='rgba(150,205,225,'+fade*0.55+')';x.lineWidth=1;x.beginPath();x.moveTo(e.a.x,e.a.y);x.lineTo(e.b.x,e.b.y);x.stroke();}
    else if(e.type==='arc'){x.strokeStyle='rgba(150,180,200,'+fade*0.3+')';x.lineWidth=1;x.beginPath();x.arc(e.c.x,e.c.y,e.r,0,6.28);x.stroke();}
    else if(e.type==='tri'){x.beginPath();x.moveTo(e.a.x,e.a.y);x.lineTo(e.b.x,e.b.y);x.lineTo(e.c.x,e.c.y);x.closePath();
      x.fillStyle='rgba(120,180,205,'+fade*0.06+')';x.fill();x.strokeStyle='rgba(150,205,225,'+fade*0.4+')';x.lineWidth=1;x.stroke();
      const cx=(e.a.x+e.b.x+e.c.x)/3,cy=(e.a.y+e.b.y+e.c.y)/3;x.fillStyle='rgba(160,210,230,'+fade*0.8+')';x.font='11px monospace';x.textAlign='center';x.fillText('∎',cx,cy+4);}
  }
  // name particles
  for(const p of P){
    let ax=(p.hx-p.x)*0.05, ay=(p.hy-p.y)*0.05;
    ax+=Math.cos(t*0.02+p.ph)*0.06; ay+=Math.sin(t*0.017+p.ph)*0.06;
    let excite=0;
    if(mouse.in){const dx=p.x-mouse.x,dy=p.y-mouse.y,d2=dx*dx+dy*dy,R=120;if(d2<R*R){const d=Math.sqrt(d2)||1,k=(1-d/R);excite=k;ax+=dx/d*k*2.6;ay+=dy/d*k*2.6;}}
    p.ex+=(excite-p.ex)*0.12;
    p.vx=(p.vx+ax)*0.82; p.vy=(p.vy+ay)*0.82; p.x+=p.vx; p.y+=p.vy;
    const appear=Math.min(1,Math.max(0,(ie-p.born)/0.5));
    const coreA=(0.6+0.4*p.ex)*appear;
    x.fillStyle='rgba(224,240,250,'+coreA+')';x.beginPath();x.arc(p.x,p.y,p.sz,0,6.28);x.fill();
  }
  raf=requestAnimationFrame(frame);
}
let raf;
if(reduce){x.fillStyle='rgba(224,240,250,0.9)';for(const p of P){x.beginPath();x.arc(p.hx,p.hy,p.sz,0,6.28);x.fill();}}
else raf=requestAnimationFrame(frame);
setTimeout(()=>{var e=document.getElementById('sub');if(e)e.classList.add('in');},400);
})();
</script></body></html>
